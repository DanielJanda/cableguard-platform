###############################################
# CableGuard MediaMTX – EXAMPLE ONLY
# Copy to mediamtx.local.yml and fill locally.
# Never commit real RTSP URLs or credentials.
###############################################

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: 127.0.0.1:9997

metrics: no
metricsAddress: 127.0.0.1:9998

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Primary internal LAN monitor origin (MediaMTX v1.11: single webrtcAllowOrigin)
webrtcAllowOrigin: http://10.6.1.40:8080

hls: yes
hlsAddress: :8888

playback: no

paths:
  zahradky-horni-stanice:
    source: rtsp://USERNAME:PASSWORD@CAMERA_92/Streaming/Channels/102
    rtspTransport: tcp
    sourceOnDemand: no

  # Comparison-only paths (local setup via scripts/setup_second_zahradky_camera.ps1)
  zahradky-horni-stanice-92:
    source: rtsp://USERNAME:PASSWORD@CAMERA_92/Streaming/Channels/102
    rtspTransport: tcp
    sourceOnDemand: no

  zahradky-horni-stanice-90:
    source: rtsp://USERNAME:PASSWORD@CAMERA_90/Streaming/Channels/102
    rtspTransport: tcp
    sourceOnDemand: no
